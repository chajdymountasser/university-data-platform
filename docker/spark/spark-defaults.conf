# ── Spark Defaults ─────────────────────────────────────────────
spark.master                     spark://spark-master:7077
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max  256m

# ── Warehouse (curated zone on MinIO S3) ──────────────────────
spark.sql.warehouse.dir          s3a://curated-zone/

# ── Python path for executors ─────────────────────────────────
spark.executorEnv.PYTHONPATH     /opt/spark/apps

# ── Hudi Extensions ────────────────────────────────────────────
spark.sql.extensions                      org.apache.spark.sql.hudi.HoodieSparkSessionExtension

# ── Hive Metastore ────────────────────────────────────────────
spark.sql.hive.metastore.version          2.3.9
spark.sql.hive.metastore.jars             builtin
spark.sql.hive.metastore.uris             thrift://hive-metastore:9083
spark.sql.hive.metastore.schema.verification  false

# ── MinIO / s3a ───────────────────────────────────────────────
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.access.key            minioadmin
spark.hadoop.fs.s3a.secret.key            minioadmin
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── Resource allocation ──────────────────────────────────────
spark.cores.max                    2
spark.executor.cores               1
spark.executor.memory              2g
spark.driver.memory                2g

# ── Performance ───────────────────────────────────────────────
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled       true
spark.sql.sources.partitionOverwriteMode  dynamic
